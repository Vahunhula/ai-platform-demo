[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-demo"
version = "0.5.2"
description = "A proof of concept for a shared, persistent AI development workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk",
    "fastapi>=0.115,<0.120",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2",
    "python-dotenv",
    "rich",
    "typer",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
ai-platform = "ai_platform.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures"]
pythonpath = ["demo_repo"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
